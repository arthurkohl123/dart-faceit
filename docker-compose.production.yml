services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION}
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DEPLOYMENT_PLATFORM: ${DEPLOYMENT_PLATFORM:-webtropia}
      DEPLOYMENT_REGION: ${DEPLOYMENT_REGION:-de}
      APP_RELEASE_SHA: ${APP_RELEASE_SHA:-unknown}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - internal

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL}
    # Supabase is bound to the VPS loopback interface. This one-way host
    # gateway is the only path from the public proxy to its API gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
