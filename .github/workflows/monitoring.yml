name: Production monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check RankedDarts production health
        run: |
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 15 \
            https://www.rankeddarts.de/api/health
      - name: Send independent outage alert
        if: failure()
        env:
          ALERT_URL: ${{ secrets.MONITORING_ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$ALERT_URL" ]; then exit 0; fi
          curl --fail --silent --show-error --max-time 10 \
            -H 'Content-Type: application/json' \
            -d '{"content":"[RankedDarts CRITICAL] Der externe Produktions-Health-Check ist fehlgeschlagen.","text":"[RankedDarts CRITICAL] Der externe Produktions-Health-Check ist fehlgeschlagen."}' \
            "$ALERT_URL"
